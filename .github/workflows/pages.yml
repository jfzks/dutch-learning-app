name: Deploy app/ and top2000/ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The flashcard app keeps the site root so installed PWAs and existing
      # links carry on working; the frequency app is published beneath it.
      - name: Stage both apps
        run: |
          mkdir -p _site/top2000
          cp -R app/. _site/
          cp -R top2000/. _site/top2000/
          rm -rf _site/top2000/tools

      - name: Upload site as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
