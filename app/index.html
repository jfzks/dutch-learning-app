<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dutch — flashcards</title>

  <!-- PWA / iOS home-screen support -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ae3a2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dutch">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <header>
    <h1><span class="flag">🇳🇱</span> Dutch flashcards</h1>
  </header>
  <main id="main"></main>
  <script src="data.js?v=8"></script>
  <script src="app.js?v=8"></script>
  <script>
    // Register the service worker so the app works offline once installed.
    // When a new worker takes control (a fresh deploy), reload once so the
    // page swaps to the new version instead of needing a manual double-refresh.
    if ('serviceWorker' in navigator) {
      // Only auto-reload when an *existing* controller is replaced by a new
      // one (a deploy). On the first-ever visit the controller starts null and
      // clients.claim() fires controllerchange too — don't reload for that.
      const hadController = !!navigator.serviceWorker.controller;
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloading) return;
        reloading = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW failed:', err));
      });
    }
  </script>
</body>
</html>
